[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tapo-battery-guard"
version = "0.3.0"
description = "Controla un enchufe Tapo según el porcentaje de batería del portátil en Windows y Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tapo Battery Guard" }]
dependencies = [
    "python-kasa>=0.10.2",
    "psutil>=6.0.0",
    "customtkinter>=5.2.2",
    "platformdirs>=4.2.0",
    "keyring>=25.0.0",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
pack = ["pyinstaller>=6.11"]

[project.scripts]
tapo-battery-guard = "tapo_battery_guard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
